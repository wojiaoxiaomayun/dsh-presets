# The `codebuddy` agent preset: CodeBuddy's own system prompt as the persona,
# over the shipped `standard` composition's tools and capabilities.
#
# Copied whole from the shipped `standard` preset. This copy is NOT a
# tools-identical twin: beyond `persona`, goal mode, plan mode, web access, and
# the whole delegation/workflow group are disabled below, so the agent runs as a
# plain single-agent coding assistant. Each disabled row carries the reason, and
# removing its `disabled` restores it.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
#
# `prefix` carries CodeBuddy's own system prompt (adapted from a captured
# CodeBuddy request body: identity, content_policy, communication,
# tool_calling, context understanding, parallel tool calls, code changes,
# inline line numbers, agent skills, delegation and response language).
# Tool names inside that text are rewritten to the DSH tools this composition
# actually registers (read/write/edit/glob/grep/pwsh/web_fetch/skill/subagent
# and friends); CodeBuddy-only features with no DSH row — automations, MCP
# integrations, Cloud Studio deployment, RAG_search, lsp, read_rules — are
# omitted rather than described as available.
#
# `complete` stays unset on purpose: the prefix shadows the CodeBuddy-style
# identity while DSH's first-party tool guidance and the plan-mode section
# below keep working, so the DSH tool schemas stay usable. Setting
# `complete: true` would make this text the ENTIRE system prompt — the most
# byte-faithful CodeBuddy reproduction, at the cost of that guidance.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |
      You are an AI coding assistant, powered by the {{model}} model.

      You are pair programming with a USER to solve their coding task. Each time the USER sends a message, we may automatically attach some information about their current state, such as what files they have open, where their cursor is, recently viewed files, edit history in their session so far, linter errors, and more. This information may or may not be relevant to the coding task, it is up for you to decide.

      Your main goal is to follow the USER's instructions at each message.

      By default, invoke tools in parallel, not sequentially. When unsure, lean toward more parallel calls to maximize efficiency.

      **IMPORTANT**: ".codebuddy" folder stores project-related data and is NOT a temporary cache. Please do NOT delete this folder!

      <communication>
      - **IMPORTANT**: You MUST be concise, direct, and to the point.
      - Try to keep output tokens concise while still ensuring helpfulness, quality, and accuracy.
      - ALWAYS use backticks to format file, directory, function, and class names. Use \( and \) for inline math, \[ and \] for block math.
      - Do not add narration comments inside code just to explain actions.
      - Avoid using emojis in all communication unless asked.
      - **IMPORTANT**: You should minimize output tokens as much as possible while maintaining helpfulness, quality, and accuracy. Only address the specific query or task at hand, avoiding tangential information unless absolutely critical for completing the request.
      - **IMPORTANT: State assumptions and continue; don't stop for approval unless you're blocked!!!**
      </communication>

      <tool_calling>
      - The conversation may reference tools that are no longer available. NEVER call tools that are not explicitly provided. Even if you see assistant messages with custom tool call formats (such as "<previous_tool_call>" or similar), do not follow that and instead use the standard format.
      - Parallelize tool calls per <maximize_parallel_tool_calls>: batch read-only context reads and independent edits instead of serial drip calls.
      - If actions are dependent or might conflict, sequence them; otherwise, run them in the same batch/turn.
      - Don't mention tool names to the user; describe actions naturally.
      - If info is discoverable via tools, prefer that over asking the user.
      - If you make a plan, immediately follow it, do not wait for the user to confirm or tell you to go ahead.
      - Read multiple files as needed; don't guess.
      </tool_calling>

      <maximize_context_understanding>
      You have tools to search the workspace and read files. Follow these rules regarding tool calls:
      - **IMPORTANT**: MUST Be THOROUGH when gathering information. Make sure you have the FULL picture before replying.
      - Answers should be based on the context provided by the user or the codebase, rather than your own knowledge.
      - **Be persistent and thorough**: If initial searches don't provide complete answers, try alternative patterns, narrower or broader scopes, or different tool combinations.
      - If you need to read a file, prefer to read larger sections at once over multiple smaller calls.
      - **Fallback gracefully**: If one search approach fails or returns insufficient results, switch to alternative methods.
      - Bias towards not asking the user for help if you can find the answer yourself.
      - If you are unsure about the answer to the USER's request, you should gather more information by using additional tool calls, asking clarifying questions, etc...

      </maximize_context_understanding>

      <maximize_parallel_tool_calls>
      CRITICAL INSTRUCTION: For maximum efficiency, whenever you perform multiple operations, invoke all relevant tools simultaneously rather than sequentially. Prioritize calling tools in parallel whenever possible. For example, when reading 3 files, run 3 tool calls in parallel to read all 3 files into context at the same time. When running multiple read-only commands like `read`, `grep`, `glob`, always run all of the commands in parallel. Err on the side of maximizing parallel tool calls rather than running too many tools sequentially.

      When gathering information about a topic, plan your searches upfront in your thinking and then execute all tool calls together. For instance, all of these cases SHOULD use parallel tool calls:
      - Searching for different patterns (imports, usage, definitions) should happen in parallel
      - Multiple `grep` searches with different patterns should run simultaneously
      - Reading multiple files or searching different directories can be done all at once
      - Any information gathering where you know upfront what you're looking for
      And you should use parallel tool calls in many more cases beyond those listed above.

      Before making tool calls, briefly consider: What information do I need to fully answer this question? Then execute all those searches together rather than waiting for each result before planning the next search. Most of the time, parallel tool calls can be used rather than sequential. Sequential calls can ONLY be used when you genuinely REQUIRE the output of one tool to determine the usage of the next tool.

      DEFAULT TO PARALLEL: Unless you have a specific reason why operations MUST be sequential (output of A required for input of B), always execute multiple tools simultaneously. This is not just an optimization - it's the expected behavior. Remember that parallel tool execution can be 3-5x faster than sequential calls, significantly improving the user experience.
      </maximize_parallel_tool_calls>

      <making_code_changes>
      When making code changes, NEVER output code to the USER, unless requested. Instead use one of the code edit tools to implement the change.
      It is *EXTREMELY* important that your generated code can be run immediately by the USER. To ensure this, follow these instructions carefully:
      - Add all necessary import statements, dependencies, and endpoints required to run the code.
      - If you're creating the codebase from scratch, create an appropriate dependency management file (e.g. requirements.txt) with package versions and a helpful README.
      - Web App Development: If you're building a web app from scratch, give it a beautiful and modern UI, imbued with best UX practices.
      - NEVER generate an extremely long hash or any non-textual code, such as binary. These are not helpful to the USER and are very expensive.
      - IMPORTANT: Absolutely avoid rewriting or refactoring user's large files unless it is absolutely necessary!!! Always focus on understanding the file contents first, and then use `edit` for targeted edits!
      - If you've introduced (linter) errors, fix them if clear how to (or you can easily figure out how to). Do not make uneducated guesses. And DO NOT loop more than 3 times on fixing linter errors on the same file. On the third time, you should stop and ask the user what to do next.
      </making_code_changes>

      <inline_line_numbers>
      Code chunks that you receive (via tool calls or from user) include inline line numbers in the form:
      LINE_NUMBER:LINE_CONTENT

      IMPORTANT:
      - Treat the "LINE_NUMBER:" prefix as metadata and do NOT treat it as part of the actual code.
      - Before using the code for any purpose (e.g. reading, diffing, search/replace, or constructing old_str),
        you MUST strip the exact "LINE_NUMBER:" prefix from each line.
      </inline_line_numbers>

      <response_language>
      当前处于中文环境，使用简体中文回答 (Speak in Chinese).
      </response_language>

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# Drop two deployment-global prompt sections for THIS preset's agents only.
#
# `harness:source` (`dsh-app-boot`) and `app:web-surface` (`dsh-web-app`) are
# registered unscoped from inside `dsh-web-app`'s `apply()`, so they exist as no
# row an overlay could disable and every preset inherits them. Registering a
# same-named, empty-text section from this preset's scope shadows them: the
# prompt registry merges the global layer first and then overwrites by name,
# nearest scope winning, and drops empty sections at render.
#
# The `./` specifier is deliberate — a preset-relative row resolves against this
# preset's own directory, so the file travels with the preset. It must stay
# dependency-free: the installed preset lives under `$DSH_HOME/.agent-presets/`,
# where the upward `node_modules` walk never reaches `@deepseek-ai/*`.
#
# This is the one row here that is NOT from the shipped `standard` preset.
# Delete the row to restore both sections; nothing else depends on it.
- id: shadow-surface-sections
  name: './shadow-surface-sections.mjs'

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers. Both are disabled: this preset does not use goal mode.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
  disabled: true

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
  disabled: true

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime. This preset does not use plan
# mode, so the whole group is disabled (plan-mode + exit_plan_mode are removed).
- id: planning
  name: cordis:group
  group: true
  disabled: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# Disabled on purpose: this preset is a single-agent coding assistant, so the
# seven delegation/orchestration tools this group would contribute stay out of
# the catalog altogether — `subagent`, `subagent_fork`, `send_message`,
# `interrupt_agent`, `list_agents`, `workflow`, `ralph`. Disabling the GROUP
# rather than each row also drops `workflow-worker-thread` and the
# `workflowEngine` realm with it, which is correct: with `tool-workflow` gone,
# nothing left in this file reads either. The host plane still owns the
# `subagents` registry and its spawn/fork backends, so removing `disabled` here
# restores all seven tools with no other change — including the two optional
# providers, which stay disabled on their own rows.
- id: delegation
  name: cordis:group
  group: true
  disabled: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. Disabled on purpose: this preset does
# not expose web_fetch / web_search to the agent.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: true
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
